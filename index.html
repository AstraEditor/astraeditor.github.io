<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>AstraEditor - 实用无上限</title>
	<link rel="icon" href="./favicon.ico">
	<link rel="stylesheet" href="./css/style.css">
</head>

<body>
	<main>
		<div class="titleBar">
			<div class="titleBar-Logo">
				<img class="titleBar-LogoImg" src="./images/logo-white.svg" alt="">
				<img class="titleBar-LogoText" src="./images/Text.svg" alt="AstraEditor">
			</div>
			<div class="titleBar-Tabs">
				<button class="titleBar-TabButton">下载</button>
				<button class="titleBar-TabButton" id="update">更新日志</button>
				<button class="titleBar-TabButton" id="repo">仓库</button>
				<button class="titleBar-TabButton" id="report">反馈</button>
				<script>
					document.querySelector('#repo').addEventListener('click', () => {
						window.open('https://github.com/AstraEditor', '_blank');
					});
					document.querySelector('#report').addEventListener('click', () => {
						window.open('https://github.com/AstraEditor/scratch-gui/issues/new', '_blank');
					});
				</script>
				<div class="titleBar-MoreContainer">
					<button class="titleBar-MoreButton" aria-label="更多选项">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
							<circle cx="8" cy="3" r="1.5"></circle>
							<circle cx="8" cy="8" r="1.5"></circle>
							<circle cx="8" cy="13" r="1.5"></circle>
						</svg>
					</button>
					<div class="titleBar-MoreDropdown"></div>
				</div>
			</div>
		</div>

		<div class="content">
			<div class="images">
				<img class="images-title" src="./images/show.png" alt="">
			</div>
			<section class="head">
				<div class="head-titles">
					<img class="head-LogoText" src="./images/Text.svg" alt="AstraEditor">
					<span class="head-Title">锤子, 而不是花束</span>
				</div>
				<div class="head-link">
					<button class="head-link-online">在线体验
						<a class="head-link-release" href="./online/index.html">快照版
						</a>
						<a class="head-link-snapshot" href="./snapshot/index.html">快照版
						</a>
					</button>
					<button class="head-link-desktop">获取桌面端</button><br>
				</div>
			</section>
			<section class="intro-section">
				<div class="intro-text">
					<span class="intro-title">闪电般迅速</span>
					<span class="intro-intro">AstraEditor 加入了更多功能, 使您的编程速度"快如闪电"</span>
				</div>
				<div class="intro-show">
					<div class="intro-show-videos" id="paint">
						<video class="intro-show-video" src="./images/paint.webm" muted>PAINT SHOW VIDEO</video>
						<span class="intro-show-text">更好的造型编辑器</span>
					</div>
					<div class="intro-show-videos" id="addons">
						<video class="intro-show-video" src="./images/addons.webm" muted>PAINT SHOW VIDEO</video>
						<span class="intro-show-text">更多插件</span>
					</div>
					<div class="intro-show-videos" id="custom">
						<video class="intro-show-video" src="./images/custom.webm" muted>PAINT SHOW VIDEO</video>
						<span class="intro-show-text">自定义主题</span>
					</div>
				</div>
			</section>
			<section class="download">
				<div class="download-titles">
					<div class="download-title">为你而生</div>
					<div class="download-intro">即刻下载 AstraEditor</div>
				</div>
				<div class="download-button"></div>
			</section>
			<section class="changelog">
				<div class="changelog-titles">
					<div class="changelog-title">更新日志</div>
					<div class="changelog-intro">查看 AstraEditor 的最新变化</div>
				</div>
				<div class="changelog-content"></div>
			</section>

			<div class="head-BackgroundAE">Æ</div>
		</div>

		<div class="end">
			<div>
				<div class="titleBar-Logo">
					<img class="titleBar-LogoImg" src="./images/logo-white.svg" alt="">
					<img class="titleBar-LogoText" src="./images/Text.svg" alt="AstraEditor">
				</div><br>
				<span class="endby">来自 AstraEditor 项目组</span><br>
				<span class="introend">
					本项目基于 TurboWarp 构建，但与 TurboWarp 项目组无关系。<br>
					所有更新的功能均为自制，如有雷同，纯属巧合

				</span>
			</div>
			<div>
				<span class="link">更多链接</span><br>
				<div style="display: flex;margin: 10px;">
					<a class="iconLinkB" href="https://space.bilibili.com/3691007061264515">
						<img class="iconLink" src="./bilibili.svg" alt="bilibili">
					</a>
					<a class="iconLinkB" href="https://qm.qq.com/q/ynYzV85oHY">
						<img class="iconLink" src="./qq.png" alt="qq">
					</a>
				</div>
			</div>
		</div>
		<footer class="footer">
			<span class="footerT">©2026 AstraEditor项目组。保留所有权利。</span>
		</footer>
	</main>
	<script src="./js/main.js"></script>
</body>

</html>
