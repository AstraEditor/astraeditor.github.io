<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Addon Settings - AstraEditor</title><style>body[data-splash-theme="dark"] {
        background: #111;
      }

      noscript {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }</style></head><body><noscript><h1>This page requires JavaScript</h1></noscript><script>(function() {
        var theme = '';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light' || themeSetting === 'modern_white') {
          theme = 'light';
        } else if (themeSetting === 'dark' || themeSetting === 'deep_dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            switch(parsed.gui){
              case 'dark':
              case 'light':
                theme = parsed.gui;
                break
              case 'modern_white':
                theme = 'light'
                break
              case 'deep_dark':
                theme = 'dark'
                break
              default:
                theme = 'light'
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        document.body.setAttribute('data-splash-theme', theme);
      })();</script><div id="app"></div><script src="js/pentapod/1238.5e255b731f6b13ac0cee.js"></script><script src="js/pentapod/1146.a3cc032f40a7a69f1250.js"></script><script src="js/pentapod/240.59df7b4d0074f16d704d.js"></script><script src="js/pentapod/addon-settings.48b8b6f447a67318360f.js"></script></body></html>
